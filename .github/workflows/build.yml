name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'

      - name: Generate Android Wrapper and Build
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          
          # Đặt tên viết thường hợp lệ cho Flutter
          flutter create --project-name app_long_tieng --org com.applongtieng --platforms=android .
          
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: AppLongTieng-APK
          path: build/app/outputs/flutter-apk/app-release.apk
