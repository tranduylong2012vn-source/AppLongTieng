name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Android Structure & Build
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          mkdir -p /tmp/android_manifest_backup
          cp android/app/src/main/AndroidManifest.xml /tmp/android_manifest_backup/ || true
          
          # Khởi tạo sườn app
          flutter create --project-name app_long_tieng --org com.applongtieng --platforms=android .
          
          # Đưa code thực tế vào lại
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          cp /tmp/android_manifest_backup/AndroidManifest.xml android/app/src/main/ || true
          
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DubbingStudio-S26Ultra-APK
          path: build/app/outputs/flutter-apk/app-release.apk
